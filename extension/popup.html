<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 340px; margin: 0; font-family: system-ui, sans-serif; background: #f5f3fa; color: #1c1738; }
    header { background: #16123a; color: #fff; padding: 12px 16px; border-bottom: 4px solid #6d4fd0; font-weight: 800; font-size: 17px; }
    main { padding: 12px 16px 16px; }
    select { width: 100%; padding: 8px; border: 1px solid #e1ddef; border-radius: 8px; font: inherit; }
    .room { background: #fff; border: 1px solid #e1ddef; border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
    .room b { display: block; }
    .room span { color: #6b6785; font-size: 12px; }
    .rent { float: right; font-weight: 800; color: #4b32a3; }
    #msg { color: #6b6785; font-size: 13px; margin: 10px 0 0; }
    a { display: block; text-align: center; margin-top: 12px; padding: 9px; border-radius: 8px; background: #6d4fd0; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <header>CampusNest</header>
  <main>
    <select id="campus"><option value="">Choose your campus</option></select>
    <p id="msg">Pick a campus to see the closest rooms.</p>
    <div id="list"></div>
    <a href="http://localhost:3000" target="_blank">Open CampusNest</a>
  </main>
  <script src="popup.js"></script>
</body>
</html>
